name: Deploy OpenIt

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: "40-character commit SHA on main to deploy"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-openit-cc
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy exact OpenIt revision
    runs-on: ubuntu-latest
    environment: production-openit-cc
    timeout-minutes: 30
    env:
      RELEASE_SHA: ${{ inputs.release_sha }}
      RUN_KEY: ${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Validate release SHA input
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "release_sha must be a 40-character lowercase commit SHA" >&2
            exit 1
          fi

      - name: Checkout exact release
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0

      - name: Verify release is current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          current_main="$(git rev-parse origin/main)"
          if [[ "$current_main" != "$RELEASE_SHA" ]]; then
            echo "Refusing deploy: release_sha is not current origin/main" >&2
            echo "origin/main=$current_main" >&2
            exit 1
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Set up pnpm
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@10.4.1 --activate

      - name: Install dependencies
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Validate and build
        shell: bash
        run: |
          set -euo pipefail
          pnpm check
          pnpm test:cargo
          node --test scripts/cargo-release-regression.test.mjs
          pnpm build
          test -f dist/index.js

      - name: Create release package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          cp -a dist release/
          cp -a scripts release/
          cp package.json pnpm-lock.yaml pnpm-workspace.yaml ecosystem.config.cjs README.md LICENSE DEPLOYMENT.md release/
          if [[ -d patches ]]; then cp -a patches release/; fi
          if [[ -d cargo ]]; then cp -a cargo release/; fi
          node scripts/cargo-release-check.mjs manifest release "$RELEASE_SHA"
          node scripts/cargo-release-check.mjs verify-local release "$RELEASE_SHA"
          tar -C release -czf "openit-$RELEASE_SHA-$RUN_KEY.tar.gz" .
          sha256sum "openit-$RELEASE_SHA-$RUN_KEY.tar.gz" > "openit-$RELEASE_SHA-$RUN_KEY.tar.gz.sha256"

      - name: Prepare SSH
        id: ssh
        shell: bash
        env:
          OPENIT_DEPLOY_SSH_KEY: ${{ secrets.OPENIT_DEPLOY_SSH_KEY }}
          OPENIT_DEPLOY_KNOWN_HOSTS: ${{ secrets.OPENIT_DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$OPENIT_DEPLOY_SSH_KEY" > ~/.ssh/openit_deploy
          printf '%s\n' "$OPENIT_DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/openit_deploy ~/.ssh/known_hosts

      - name: Upload release package
        shell: bash
        env:
          OPENIT_DEPLOY_HOST: ${{ secrets.OPENIT_DEPLOY_HOST }}
          OPENIT_DEPLOY_PORT: ${{ secrets.OPENIT_DEPLOY_PORT }}
          OPENIT_DEPLOY_USER: ${{ secrets.OPENIT_DEPLOY_USER }}
        run: |
          set -euo pipefail
          scp -i ~/.ssh/openit_deploy -P "$OPENIT_DEPLOY_PORT" \
            "openit-$RELEASE_SHA-$RUN_KEY.tar.gz" \
            "openit-$RELEASE_SHA-$RUN_KEY.tar.gz.sha256" \
            "$OPENIT_DEPLOY_USER@$OPENIT_DEPLOY_HOST:/tmp/"

      - name: Recheck current main before installation
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$RELEASE_SHA"

      - name: Back up and atomically exchange code units
        id: install
        shell: bash
        env:
          OPENIT_DEPLOY_HOST: ${{ secrets.OPENIT_DEPLOY_HOST }}
          OPENIT_DEPLOY_PORT: ${{ secrets.OPENIT_DEPLOY_PORT }}
          OPENIT_DEPLOY_USER: ${{ secrets.OPENIT_DEPLOY_USER }}
          OPENIT_WEB_ROOT: ${{ secrets.OPENIT_WEB_ROOT }}
        run: |
          set -euo pipefail
          test "$OPENIT_WEB_ROOT" = /www/wwwroot/openit.cc
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
            -i ~/.ssh/openit_deploy -p "$OPENIT_DEPLOY_PORT" "$OPENIT_DEPLOY_USER@$OPENIT_DEPLOY_HOST" \
            "bash -s -- apply '$RELEASE_SHA' '$RUN_KEY'" < scripts/cargo-release-install.sh

      - name: Verify public HTTPS artifacts and Cargo behavior
        id: acceptance
        shell: bash
        run: |
          set -euo pipefail
          node scripts/cargo-release-check.mjs verify-public release "$RELEASE_SHA" https://openit.cc | tee cargo-acceptance-apex.json
          node scripts/cargo-release-check.mjs verify-public release "$RELEASE_SHA" https://www.openit.cc | tee cargo-acceptance-www.json

      - name: Record accepted release SHA
        id: finalize
        shell: bash
        env:
          OPENIT_DEPLOY_HOST: ${{ secrets.OPENIT_DEPLOY_HOST }}
          OPENIT_DEPLOY_PORT: ${{ secrets.OPENIT_DEPLOY_PORT }}
          OPENIT_DEPLOY_USER: ${{ secrets.OPENIT_DEPLOY_USER }}
          OPENIT_WEB_ROOT: ${{ secrets.OPENIT_WEB_ROOT }}
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$RELEASE_SHA"
          test "$OPENIT_WEB_ROOT" = /www/wwwroot/openit.cc
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
            -i ~/.ssh/openit_deploy -p "$OPENIT_DEPLOY_PORT" "$OPENIT_DEPLOY_USER@$OPENIT_DEPLOY_HOST" \
            "bash -s -- finalize '$RELEASE_SHA' '$RUN_KEY'" < scripts/cargo-release-install.sh

      - name: Restore previous code after installation or acceptance failure
        if: ${{ always() && (steps.install.outcome == 'success' || steps.install.outcome == 'failure' || steps.install.outcome == 'cancelled') && steps.finalize.outcome != 'success' }}
        shell: bash
        env:
          OPENIT_DEPLOY_HOST: ${{ secrets.OPENIT_DEPLOY_HOST }}
          OPENIT_DEPLOY_PORT: ${{ secrets.OPENIT_DEPLOY_PORT }}
          OPENIT_DEPLOY_USER: ${{ secrets.OPENIT_DEPLOY_USER }}
          OPENIT_WEB_ROOT: ${{ secrets.OPENIT_WEB_ROOT }}
        run: |
          set -euo pipefail
          test "$OPENIT_WEB_ROOT" = /www/wwwroot/openit.cc
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
            -i ~/.ssh/openit_deploy -p "$OPENIT_DEPLOY_PORT" "$OPENIT_DEPLOY_USER@$OPENIT_DEPLOY_HOST" \
            "bash -s -- rollback '$RELEASE_SHA' '$RUN_KEY'" < scripts/cargo-release-install.sh

      - name: Inventory retained release artifacts without deletion
        if: ${{ always() && steps.ssh.outcome == 'success' && steps.install.outcome != 'skipped' }}
        continue-on-error: true
        shell: bash
        env:
          OPENIT_DEPLOY_HOST: ${{ secrets.OPENIT_DEPLOY_HOST }}
          OPENIT_DEPLOY_PORT: ${{ secrets.OPENIT_DEPLOY_PORT }}
          OPENIT_DEPLOY_USER: ${{ secrets.OPENIT_DEPLOY_USER }}
          OPENIT_WEB_ROOT: ${{ secrets.OPENIT_WEB_ROOT }}
        run: |
          set -euo pipefail
          test "$OPENIT_WEB_ROOT" = /www/wwwroot/openit.cc
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
            -i ~/.ssh/openit_deploy -p "$OPENIT_DEPLOY_PORT" "$OPENIT_DEPLOY_USER@$OPENIT_DEPLOY_HOST" \
            "bash -s -- inventory '$RELEASE_SHA' '$RUN_KEY'" < scripts/cargo-release-install.sh
