name: Cargo regression checks

on:
  pull_request:
    paths:
      - 'cargo/**'
      - 'scripts/cargo-release*'
      - '.github/workflows/deploy-openit.yml'
      - '.github/workflows/cargo-ci.yml'
  push:
    branches: [main]
    paths:
      - 'cargo/**'
      - 'scripts/cargo-release*'
      - '.github/workflows/deploy-openit.yml'
      - '.github/workflows/cargo-ci.yml'

permissions:
  contents: read

jobs:
  cargo:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test cargo/*regression.test.mjs
      - run: node --test scripts/cargo-release-regression.test.mjs
